name: Deploy FarmFactory

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Verify SKILL.md exists
        run: |
          if [ ! -f SKILL.md ]; then
            echo ""
            echo "❌  SKILL.md not found!"
            echo ""
            echo "    Every crypto product must have SKILL.md — a guide for AI agents."
            echo "    Create SKILL.md with these sections:"
            echo ""
            echo "      ## What is this project   — description, live URL, repo link"
            echo "      ## Stack                  — tech stack (frontend, contracts, hosting)"
            echo "      ## Repository structure   — key files/dirs and their purpose"
            echo "      ## Build & Deploy         — build commands, CI pipeline, server paths"
            echo "      ## Common tasks           — how to add networks, update contracts, fund farms"
            echo "      ## Troubleshooting        — known errors and fixes"
            echo ""
            echo "    Example: https://github.com/noxonsu/farmfactory/blob/main/SKILL.md"
            echo ""
            exit 1
          fi
          echo "✓ SKILL.md found"

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'

      - name: Generate version
        id: version
        run: |
          VERSION="2.$(date -u +%y.%m%d)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Update version in plugin files
        run: |
          # Update plugin header version
          sed -i "s/^ \* Version: .*/ * Version: ${{ env.VERSION }}/" wordpress/farmfactory.php

          # Update version constant
          sed -i "s/define( 'FARMFACTORY_VER', '.*'/define( 'FARMFACTORY_VER', '${{ env.VERSION }}'/" wordpress/farmfactory.php

          echo "Updated wordpress/farmfactory.php:"
          grep -E "Version:|FARMFACTORY_VER" wordpress/farmfactory.php

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "lib" ]; then
            echo "Error: lib directory not found"
            exit 1
          fi
          if [ -z "$(ls -A lib)" ]; then
            echo "Error: lib directory is empty"
            exit 1
          fi
          echo "Build output verified"

      - name: Create info.json
        run: |
          # Get commit message safely via git (avoids shell injection from GitHub Actions expression)
          COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S")
          VERSION="${{ env.VERSION }}"

          # Use jq to build JSON safely (handles all special characters in commit messages)
          jq -n \
            --arg name "Farm Factory" \
            --arg version "$VERSION" \
            --arg tested "6.4" \
            --arg requires "5.0" \
            --arg requires_php "7.1" \
            --arg download_url "https://farm.wpmix.net/updates/farmfactory-v${VERSION}.zip" \
            --arg last_updated "$TIMESTAMP" \
            --arg description "Stake farming contract - allows users to stake tokens and earn rewards on Ethereum, BSC, and Polygon networks" \
            --arg installation "Upload the plugin files to /wp-content/plugins/farmfactory/, then activate the plugin through the Plugins menu in WordPress" \
            --arg changelog "<h4>${VERSION}</h4><ul><li>${COMMIT_MSG}</li></ul>" \
            '{
              name: $name,
              version: $version,
              tested: $tested,
              requires: $requires,
              requires_php: $requires_php,
              download_url: $download_url,
              last_updated: $last_updated,
              sections: {
                description: $description,
                installation: $installation,
                changelog: $changelog
              }
            }' > info.json

          echo "Generated info.json:"
          cat info.json
          echo "Validating JSON..."
          jq . info.json > /dev/null && echo "Valid JSON" || (echo "Invalid JSON" && exit 1)

      - name: Create WordPress plugin package
        run: |
          echo "Creating WordPress plugin package..."

          # Create package directory with plugin subdirectory (WordPress standard)
          mkdir -p farmfactory-package/farmfactory

          # Copy all WordPress plugin files from wordpress/ directory
          echo "Copying WordPress plugin files..."
          cp -r wordpress/* farmfactory-package/farmfactory/

          # Copy reactwidget (React bundle - built separately in src_react/)
          echo "Copying reactwidget..."
          cp -r reactwidget farmfactory-package/farmfactory/reactwidget

          # Copy App directory (controllers)
          echo "Copying App directory..."
          cp -r App farmfactory-package/farmfactory/

          # Copy lang directory (translations)
          if [ -d "lang" ]; then
            echo "Copying lang directory..."
            cp -r lang farmfactory-package/farmfactory/
          fi

          # Overwrite lib with fresh build output
          echo "Copying build output to lib..."
          cp -r lib/* farmfactory-package/farmfactory/lib/

          # Copy additional files
          if [ -f "README.md" ]; then
            cp README.md farmfactory-package/farmfactory/
          fi
          if [ -f "LICENCE" ]; then
            cp LICENCE farmfactory-package/farmfactory/
          fi

          # Verify structure
          echo "Package structure:"
          ls -la farmfactory-package/farmfactory/

          # Create ZIP (from package directory, so farmfactory/ is the root in ZIP)
          cd farmfactory-package
          zip -r ../farmfactory-v${{ env.VERSION }}.zip farmfactory
          cd ..

          # Verify ZIP
          if [ ! -f "farmfactory-v${{ env.VERSION }}.zip" ]; then
            echo "Error: ZIP file not created"
            exit 1
          fi

          echo "Package created: farmfactory-v${{ env.VERSION }}.zip"
          ls -lh farmfactory-v${{ env.VERSION }}.zip
          echo "ZIP contents:"
          unzip -l farmfactory-v${{ env.VERSION }}.zip | head -30

      - name: Upload to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "farmfactory-v${{ env.VERSION }}.zip,info.json"
          target: "/home/farmFactory/incoming/"

      - name: Update info.json on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/farmFactory/web/farm.wpmix.net/public_html/updates
            cp /home/farmFactory/incoming/info.json /home/farmFactory/web/farm.wpmix.net/public_html/updates/farmfactory-info.json
            chmod 644 /home/farmFactory/web/farm.wpmix.net/public_html/updates/farmfactory-info.json
            echo "info.json updated as farmfactory-info.json"
            cat /var/www/html/farmfactory/info.json

      - name: Deploy WordPress plugin ZIP to updates directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            PLUGIN_DIR="/home/farmFactory/web/farm.wpmix.net/public_html/wp-content/plugins/farmfactory"
            ZIP="/home/farmFactory/incoming/farmfactory-v${{ env.VERSION }}.zip"

            # Install plugin directly to WordPress plugin directory
            rm -rf /tmp/farmfactory-extract
            mkdir -p /tmp/farmfactory-extract
            unzip -o "$ZIP" -d /tmp/farmfactory-extract/
            rsync -a --delete /tmp/farmfactory-extract/farmfactory/ "$PLUGIN_DIR/"
            chown -R www-data:www-data "$PLUGIN_DIR/" 2>/dev/null || true
            rm -rf /tmp/farmfactory-extract
            echo "✓ Plugin installed to WordPress: $PLUGIN_DIR"

            # Copy ZIP to updates directory
            mkdir -p /home/farmFactory/web/farm.wpmix.net/public_html/updates
            cp "$ZIP" /home/farmFactory/web/farm.wpmix.net/public_html/updates/
            chmod 644 /home/farmFactory/web/farm.wpmix.net/public_html/updates/farmfactory-v${{ env.VERSION }}.zip
            rm -f "$ZIP"

            echo "✓ ZIP available at updates/farmfactory-v${{ env.VERSION }}.zip"

      - name: Deploy static demo (if exists)
        uses: appleboy/ssh-action@master
        continue-on-error: true
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if [ -d "/home/farmFactory/incoming/demo" ]; then
              mkdir -p /var/www/html/farmfactory-demo
              cp -r /home/farmFactory/incoming/demo/* /var/www/html/farmfactory-demo/
              echo "Demo files deployed"
            else
              echo "No demo files to deploy"
            fi

      - name: Health check
        run: |
          echo "Waiting 10 seconds for deployment to settle..."
          sleep 10

          # Check if info.json is accessible
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://farm.wpmix.net/farmfactory/info.json || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Health check passed (HTTP $HTTP_CODE)"
          else
            echo "⚠ Warning: Health check returned HTTP $HTTP_CODE (non-blocking)"
          fi


      - name: Assemble GitHub Pages demo
        run: |
          mkdir -p _gh_pages
          # Root index.html (with wallet header, paths relative to root)
          cp index.html _gh_pages/index.html
          # demo/ subdir (paths relative to demo/, use ../reactwidget/ etc.)
          cp -r demo/ _gh_pages/
          # reactwidget/ and wordpress/ (referenced by root index.html)
          cp -r reactwidget/ _gh_pages/
          cp -r wordpress/ _gh_pages/
          touch _gh_pages/.nojekyll

      - name: Deploy demo to appsource/farm
        uses: peaceiris/actions-gh-pages@v3
        continue-on-error: true
        with:
          personal_token: ${{ secrets.APPSOURCE_TOKEN }}
          external_repository: appsource/farm
          publish_branch: main
          publish_dir: ./_gh_pages
          force_orphan: true

      - name: Notify completion
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✓ FarmFactory deployment complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Version: ${{ env.VERSION }}"
          echo "Package: farmfactory-v${{ env.VERSION }}.zip"
          echo "Download: https://farm.wpmix.net/updates/farmfactory-v${{ env.VERSION }}.zip"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Notify failure
        if: failure()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✗ FarmFactory deployment failed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Version: ${{ env.VERSION }}"
          echo "Check workflow logs for details"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
